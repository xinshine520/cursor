<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="产品详情 - TechCorp">
    <title>产品详情 - TechCorp</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* 产品详情页特定样式 */
        .product-detail {
            padding: 120px 0 80px;
            background: var(--bg-white);
        }

        .product-detail-header {
            max-width: 1200px;
            margin: 0 auto 60px;
            padding: 0 20px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .breadcrumb a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
        }

        .breadcrumb a:hover {
            color: var(--primary-color);
        }

        .breadcrumb span {
            color: var(--text-secondary);
        }

        .product-detail-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: start;
        }

        .product-detail-image {
            position: sticky;
            top: 100px;
            width: 100%;
            height: 500px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .product-detail-image .product-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            color: rgba(255, 255, 255, 0.3);
        }

        .product-detail-info {
            padding: 20px 0;
        }

        .product-detail-title {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        .product-detail-subtitle {
            font-size: 24px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .product-detail-description {
            font-size: 17px;
            line-height: 1.8;
            color: var(--text-primary);
            margin-bottom: 40px;
        }

        .product-features {
            margin-bottom: 40px;
        }

        .product-features h3 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .feature-item {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 20px;
            padding: 20px;
            background: var(--bg-light);
            border-radius: 12px;
            transition: var(--transition);
        }

        .feature-item:hover {
            background: #e8e8ed;
            transform: translateX(8px);
        }

        .feature-icon {
            font-size: 24px;
            flex-shrink: 0;
        }

        .feature-content h4 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .feature-content p {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .product-specs {
            margin-bottom: 40px;
        }

        .product-specs h3 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .specs-table {
            width: 100%;
            border-collapse: collapse;
        }

        .specs-table tr {
            border-bottom: 1px solid var(--border-color);
        }

        .specs-table td {
            padding: 16px 0;
            font-size: 15px;
        }

        .specs-table td:first-child {
            font-weight: 600;
            color: var(--text-primary);
            width: 40%;
        }

        .specs-table td:last-child {
            color: var(--text-secondary);
        }

        .product-cta {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .product-detail-section {
            margin-top: 80px;
            padding-top: 80px;
            border-top: 1px solid var(--border-color);
        }

        .product-detail-section h2 {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 32px;
            letter-spacing: -0.02em;
        }

        .product-detail-section p {
            font-size: 17px;
            line-height: 1.8;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .product-detail-section ul {
            list-style: none;
            padding: 0;
        }

        .product-detail-section ul li {
            padding: 12px 0;
            padding-left: 32px;
            position: relative;
            font-size: 17px;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .product-detail-section ul li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: var(--primary-color);
            font-weight: 600;
            font-size: 20px;
        }

        @media (max-width: 768px) {
            .product-detail-content {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .product-detail-image {
                position: static;
                height: 300px;
            }

            .product-detail-title {
                font-size: 36px;
            }

            .product-detail-subtitle {
                font-size: 20px;
            }
        }
    </style>
</head>

            <div class="footer-bottom">

        };

        // 获取 URL 参数
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // 加载产品详情
        function loadProductDetail() {
            const productId = getUrlParameter('product') || 'platform';
            const product = products[productId];

            if (!product) {
                // 如果产品不存在，跳转到首页
                window.location.href = 'index.html';
                return;
            }

            // 更新页面标题
            document.title = `${product.title} - TechCorp`;
            document.querySelector('meta[name="description"]').content = product.subtitle;

            // 更新面包屑
            document.getElementById('breadcrumb-product').textContent = product.title;

            // 更新产品图片
            const productImage = document.getElementById('product-image');
            productImage.className = `product-placeholder ${product.imageClass}`;

            // 更新产品信息
            document.getElementById('product-title').textContent = product.title;
            document.getElementById('product-subtitle').textContent = product.subtitle;
            document.getElementById('product-description').textContent = product.description;

            // 更新特性列表
            const featuresList = document.getElementById('product-features-list');
            featuresList.innerHTML = product.features.map(feature => `
                <div class="feature-item">
                    <span class="feature-icon">${feature.icon}</span>
                    <div class="feature-content">
                        <h4>${feature.title}</h4>
                        <p>${feature.description}</p>
                    </div>
                </div>
            `).join('');

            // 更新技术规格
            const specsTable = document.getElementById('product-specs');
            specsTable.innerHTML = product.specs.map(spec => `
                <tr>
                    <td>${spec[0]}</td>
                    <td>${spec[1]}</td>
                </tr>
            `).join('');

            // 更新详情内容
            const detailContent = document.getElementById('product-detail-content');
            detailContent.innerHTML = `
                <p>${product.detail.intro}</p>
                <h3 style="font-size: 24px; font-weight: 600; margin: 32px 0 16px;">核心优势</h3>
                <ul>
                    ${product.detail.highlights.map(item => `<li>${item}</li>`).join('')}
                </ul>
                <h3 style="font-size: 24px; font-weight: 600; margin: 32px 0 16px;">应用场景</h3>
                <ul>
                    ${product.detail.useCases.map(item => `<li>${item}</li>`).join('')}
                </ul>
            `;
        }

        // 页面加载时执行
        document.addEventListener('DOMContentLoaded', loadProductDetail);
    </script>
</body>
